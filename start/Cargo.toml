[package]
name = "start"
# Frozen on purpose, and deliberately not a release-please extra-file: bumping it also
# moves start/Cargo.lock, which release-please has no safe updater for. The template's
# version lives in tauri.conf.json — see docs/OVERVIEW.md, "Versioning and releases".
version = "1.0.1"
edition = "2021"
description = "Brings up the dev environment container and opens code-server in a native window"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
ureq = "2"
# Already in the tree via tauri; named here because this crate reads the
# project manifest itself. See limits() in src/main.rs.
serde_json = "1"
