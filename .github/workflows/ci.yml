name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all shell scripts
        run: |
          find . -type f \( -name '*.sh' -o -name 'setup' \) -print0 \
            | xargs -0 -n1 bash -n

  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: start
      - name: cargo check
        working-directory: start
        # --locked so a Cargo.lock left behind by a release bump fails here, on the release
        # PR itself, instead of turning up as a dirty submodule in a consuming monorepo.
        run: cargo check --release --locked

  core-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build core only
        run: docker build -f core/Dockerfile.frag -t core-ci .

  discover-stacks:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "stacks=$(ls stacks | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  stack-build:
    needs: discover-stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.discover-stacks.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4
      # Composed through the same script `setup` uses, so CI builds a stack
      # the way the product actually builds it — including pulling in any
      # requires.json dependency. This step used to concatenate core + the
      # one stack by hand and skip dependencies, which is why the android
      # job built without a JDK and failed on the Java-based `avdmanager`.
      - name: docker build core + ${{ matrix.stack }} (lowest listed version)
        run: |
          core/compose-dockerfile.sh "${{ matrix.stack }}" > /tmp/Dockerfile
          docker build -f /tmp/Dockerfile -t "stack-ci-${{ matrix.stack }}" .

  # The one check branch protection requires, and the only reason this job exists.
  # stack-build's job names come from a matrix built by `ls stacks`, so they change
  # whenever a stack is added or removed: naming them individually would leave a
  # required check that stops reporting (blocking every merge) and would not cover a
  # newly added stack. This name never changes and stands for all of them.
  ci-green:
    if: always()
    needs: [bash-syntax, cargo-check, core-build, discover-stacks, stack-build]
    runs-on: ubuntu-latest
    steps:
      - name: fail unless every job above succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || exit 1
          done
