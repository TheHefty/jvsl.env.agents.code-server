name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all shell scripts
        run: |
          find . -type f \( -name '*.sh' -o -name 'setup' -o -name 'init' -o -name 'dev' \) -print0 \
            | xargs -0 -n1 bash -n

  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: start
      - name: cargo check
        working-directory: start
        # --locked so a Cargo.lock left behind by a release bump fails here, on the release
        # PR itself, instead of turning up as a dirty submodule in a consuming monorepo.
        run: cargo check --release --locked
      - name: cargo test
        working-directory: start
        run: cargo test --release --locked

  host-packages:
    # `init` offers to install what the table in packages.sh names, so a wrong
    # name puts the wrong thing on somebody's host and a missing one is worse:
    # the package drops out of the list silently, the install succeeds, and the
    # dependency is still missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every dependency is named in every package manager
        run: bash packages.test.sh

  editor-defaults:
    # The merge that puts the image's default settings into an environment that
    # already exists. Its direction is the thing worth guarding: inverted, it is
    # silent and it quietly puts a setting back on every restart, which is the
    # kind of bug the reader blames on the editor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the merge honours what is already there
        run: bash core/cont-init/30-editor-defaults.test.sh

  ai-memory:
    # The boot hook must preserve ai-memory opt-in and register every supported
    # first-party client. A missing Codex registration is silent until a new
    # session starts without memory, so the hook is exercised directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: opted-in projects receive ai-memory client wiring
        run: bash core/cont-init/40-ai-memory.test.sh

  jail-wrappers:
    # The flags core/bin/claude.sh and core/bin/codex.sh hand ai-jail. Every one
    # of them fails quietly when it is wrong: a variable the sandbox never
    # receives does not error, it produces a tool inside the jail that behaves as
    # if it were misconfigured, and the message it prints blames something else.
    # DOCKER_HOST cost one round of that and RUSTUP_HOME cost another. With two
    # agents sharing one list there is a third way to be wrong — for the list to
    # stop being one list — and that is what most of this job is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the sandbox is handed what it cannot inherit
        run: bash core/bin/jail-wrappers.test.sh

  compose-versions:
    # core's pinned versions moved out of the middle of a RUN line and into
    # core/versions.json. What this guards is the seam: a placeholder no key
    # fills must stop the compose by name, not reach `docker build` as literal
    # text and fail there as an npm error about a version that does not exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: core's pins reach the Dockerfile
        run: bash core/compose-dockerfile.test.sh

  php-keyring:
    # The php stack installs from a third-party archive and is the only one that
    # does, so it is the only one carrying a signing key. What this guards is
    # drift between the three places that key lives — the file, the fingerprint
    # written into the fragment, and the fragment still being wired to use it.
    # Deliberately offline: verifying against the live PPA would put every run
    # back at the mercy of the Launchpad outage the pin exists to survive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the pinned key is the one the archive is signed with
        run: bash stacks/php/keyring.test.sh

  agent-docs:
    # The normative process documents now ship from here and reach a project by
    # bump, in one folder per language. Two things can rot without anything
    # failing: the languages drifting apart, and the migration script eating the
    # half of a project's rules the project wrote itself. Both are checked, and
    # both checks are offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the language folders are the same document
        run: bash docs/agent/check-parity.sh
      - name: the parity check can actually fail
        run: bash docs/agent/check-parity.test.sh
      - name: migration never destroys what a project wrote
        run: bash migrate-agent-docs.test.sh

  md-size:
    # A Markdown file past 50 KiB stops being read and starts being skimmed,
    # which is worse than being short: it still looks authoritative. Nothing
    # noticed docs/OVERVIEW.md growing to 86 KiB over a year of releases, because
    # the rule shipped from here while the tool to enforce it did not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no tracked Markdown over the limit
        run: bash scripts/check-md-size.sh
      - name: the size check can actually fail
        run: bash scripts/check-md-size.test.sh

  title-bar:
    # The one piece of this launcher that runs inside somebody else's page, and the
    # one written to fail quietly: if code-server stops calling its title bar
    # `.part.titlebar`, nothing is injected and nothing complains. Silence is the
    # right behaviour there and the reason this job exists — the failure is
    # otherwise invisible until somebody opens the window and wonders where the
    # buttons went.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package.json and no dependencies: the runner is node's own, and the
      # script under test is read from disk as the binary embeds it.
      - name: node --test
        run: node --test start/src/title_bar.test.mjs

  core-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build core only
        # Composed rather than built straight from the fragment, which is how
        # this ran until core gained {{NAME_VERSION}} placeholders of its own.
        # Building the raw fragment now fails on the literal `{{CODEX_VERSION}}`
        # — and would have, silently, for anyone who copied this line.
        run: |
          core/compose-dockerfile.sh > "$RUNNER_TEMP/core.Dockerfile"
          docker build -f "$RUNNER_TEMP/core.Dockerfile" -t core-ci .

  discover-stacks:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "stacks=$(ls stacks | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  stack-build:
    needs: discover-stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.discover-stacks.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4
      # Composed through the same script `setup` uses, so CI builds a stack
      # the way the product actually builds it — including pulling in any
      # requires.json dependency. This step used to concatenate core + the
      # one stack by hand and skip dependencies, which is why the android
      # job built without a JDK and failed on the Java-based `avdmanager`.
      - name: docker build core + ${{ matrix.stack }} (lowest listed version)
        run: |
          core/compose-dockerfile.sh "${{ matrix.stack }}" > /tmp/Dockerfile
          docker build -f /tmp/Dockerfile -t "stack-ci-${{ matrix.stack }}" .

      # A successful `docker build` proves apt-get ran. It does not prove the
      # stack delivered what it exists to deliver — a header on the include
      # path, a tool on PATH — and for some of those the difference only shows
      # up much later, on someone else's machine, as a capability that silently
      # is not there. So a stack may carry an image.test.sh, run here against
      # the image just built. Optional by design: no stack is required to have
      # one, and the step is a no-op where the file is absent.
      #
      # --entrypoint is needed because the base image's entrypoint is the s6
      # init, which would start the whole service tree instead of running the
      # script. --network none because an image test asserts what is IN the
      # image; anything it had to fetch would be testing something else.
      - name: image checks for ${{ matrix.stack }}, if it has any
        run: |
          test="stacks/${{ matrix.stack }}/image.test.sh"
          if [ ! -f "$test" ]; then
            echo "no $test — nothing to check inside the image"
            exit 0
          fi
          docker run --rm --network none \
            --entrypoint /bin/bash \
            -v "$PWD/stacks/${{ matrix.stack }}:/image-test:ro" \
            "stack-ci-${{ matrix.stack }}" /image-test/image.test.sh

  # The one check branch protection requires, and the only reason this job exists.
  # stack-build's job names come from a matrix built by `ls stacks`, so they change
  # whenever a stack is added or removed: naming them individually would leave a
  # required check that stops reporting (blocking every merge) and would not cover a
  # newly added stack. This name never changes and stands for all of them.
  ci-green:
    if: always()
    needs: [bash-syntax, cargo-check, host-packages, editor-defaults, ai-memory, jail-wrappers, compose-versions, php-keyring, agent-docs, md-size, title-bar, core-build, discover-stacks, stack-build]
    runs-on: ubuntu-latest
    steps:
      - name: fail unless every job above succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || exit 1
          done
