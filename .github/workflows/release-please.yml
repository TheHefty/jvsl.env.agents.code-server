name: release-please

on:
  push:
    branches:
      - main

# The default GITHUB_TOKEN is enough for both steps the action performs, as
# long as the repo has "Allow GitHub Actions to create and approve pull
# requests" enabled (Settings -> Actions -> General) — without it, opening the
# release PR fails.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
